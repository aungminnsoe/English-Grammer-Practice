    </div>
  </div>
  <div id="wresults"></div>
  <div id="wbrowse" class="${wordQuery ? 'hide' : ''}">
    <button class="tile mt" style="--tc:rgba(255,197,61,.45);width:100%" onclick="openWord('${wd}')">
      <div class="row sb" style="position:relative;z-index:1">
        <div style="min-width:0"><span class="em">📅</span>
          <b style="color:var(--c2);font-size:17px">${esc(we.w)}</b>
          <span style="margin-top:3px">${esc(we.d).slice(0, 72)}${we.d.length > 72 ? '…' : ''}</span>
          <span class="tiny" style="color:var(--dim2);margin-top:4px">Word of the day</span>
        </div><div style="font-size:30px;opacity:.5">›</div></div>
    </button>

    <div class="row mt" style="gap:9px">
      <div class="stat"><b class="mono">${DICT_COUNT}</b><span>Offline words</span></div>
      <div class="stat"><b class="mono">${sv}</b><span>Your words</span></div>
      <div class="stat"><b class="mono">${(S.wstats || {}).rev || 0}</b><span>Reviews</span></div>
    </div>

    <button class="tile mt" style="--tc:${due ? 'rgba(43,224,139,.5)' : 'rgba(255,255,255,.12)'};width:100%"
      onclick="${due ? 'startFlashcards()' : "toast('Save a few words first - tap the star on any word card')"}">
      <div class="row sb" style="position:relative;z-index:1"><div>
        <span class="em">🃏</span><b>Flashcard review</b>
        <span>${due ? due + ' word' + (due > 1 ? 's' : '') + ' ready to review now' : 'Nothing due — save words with the ⭐'}</span>
      </div><div style="font-size:30px;opacity:.5">›</div></div>
    </button>

    ${sv ? `<div class="cap mt2 mb">Your saved words</div>
      ${savedList().slice(0, 6).map(k => wordRow(k)).join('')}
      ${sv > 6 ? `<button class="btn full sm" onclick="showCat('saved')">See all ${sv} saved words</button>` : ''}` : ''}

    <div class="cap mt2 mb">Browse</div>
    <div class="tiles">
      ${WORD_CATS.map(c => `<button class="tile" style="--tc:rgba(124,92,255,.4)" onclick="showCat('${c.id}')">
        <span class="em">${c.em}</span><b>${c.name}</b><span>${catWords(c.id).length} words · ${c.desc}</span></button>`).join('')}
      <button class="tile" style="--tc:rgba(25,227,255,.45)" onclick="showCat('az')">
        <span class="em">🔤</span><b>A – Z index</b><span>Every offline word</span></button>
      <button class="tile" style="--tc:rgba(255,61,203,.45)" onclick="openWord(pick(DICT_KEYS))">
        <span class="em">🎲</span><b>Random word</b><span>Learn something new</span></button>
    </div>

    <div class="card mt sm muted" style="line-height:1.65">
      <b style="color:var(--txt)">${DICT_COUNT} words work with no internet.</b>
      Anything else is fetched from a free online dictionary the first time you look it up, then stored on this device for ever.${cached ? ' You have ' + cached + ' extra word' + (cached > 1 ? 's' : '') + ' cached this way.' : ''}
    </div>`;
}

function wordRow(k, hl) {
  const e = DICT[k] || WCACHE[k];
  if (!e) return '';
  const d = (e.d || '').replace(/<[^>]+>/g, '');
  return `<button class="topic" onclick="openWord('${esc(k).replace(/'/g, "\\'")}')">
    <div class="n" style="font-size:13px;background:rgba(124,92,255,.2);color:#cfc8ff">${e.w.charAt(0).toUpperCase()}</div>
    <div class="t"><b>${esc(e.w)} ${e.p ? `<span class="tiny muted" style="font-weight:600">${esc(e.p)}</span>` : ''}</b>
      <div class="tiny muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(d)}</div></div>
    ${isSaved(k) ? '<span style="font-size:14px">⭐</span>' : ''}
    <div style="font-size:16px;opacity:.3">›</div></button>`;
}

let wSearchT = null;
function onWordSearch(v) {
  wordQuery = v;
  clearTimeout(wSearchT);
  wSearchT = setTimeout(() => {
    const box = $('#wresults'), browse = $('#wbrowse');
    if (!box) return;
    if (!v.trim()) { box.innerHTML = ''; if (browse) browse.classList.remove('hide'); return; }
    if (browse) browse.classList.add('hide');
    const hits = dictSearch(v, 40);
    const q = normalise(v);
    const exact = DICT[q] || WCACHE[q];
    const formOf = !exact && FORMS[q] ? DICT[FORMS[q]] : null;
    box.innerHTML =
      (formOf ? `<div class="card mt sm" style="border-color:rgba(25,227,255,.4);background:rgba(25,227,255,.07)">
        <b style="color:var(--c2)">"${esc(v.trim())}"</b> is a form of <b>${esc(formOf.w)}</b>${formOf.fm ? ' <span class="muted">(' + esc(formOf.fm) + ')</span>' : ''}</div>` : '') +
      `<div class="cap mt mb">${hits.length ? hits.length + ' result' + (hits.length > 1 ? 's' : '') : 'No offline match'}</div>` +
      hits.map(k => wordRow(k)).join('') +
      (exact ? '' : `<button class="btn cy full mt" onclick="searchGo()">🌐 Look up "${esc(v.trim())}" online</button>
        <div class="tiny muted tc mt" style="margin-top:7px">Needs internet once, then it is saved on your device.</div>`);
  }, 120);
}
function clearWordSearch() { wordQuery = ''; go('words'); }
function searchGo() {
  const v = ($('#wsearch') || {}).value || wordQuery;
  if (v && v.trim()) openWord(v.trim());
}

/* ---------- category / index browsing ---------- */
function showCat(id) {
  let keys, title, sub;
  if (id === 'saved') { keys = savedList(); title = '⭐ Your saved words'; sub = 'Tap a word to review it'; }
  else if (id === 'az') { keys = DICT_KEYS; title = '🔤 A – Z index'; sub = DICT_COUNT + ' offline words'; }
  else {
    const c = WORD_CATS.find(x => x.id === id);
    keys = catWords(id); title = c.em + ' ' + c.name; sub = c.desc;
  }
  const groups = {};
  keys.forEach(k => { const L = k.charAt(0).toUpperCase(); (groups[L] = groups[L] || []).push(k); });
  const letters = Object.keys(groups).sort();
  sheet(`<div class="row sb"><b style="font-size:19px">${title}</b>
      <button class="iconbtn" onclick="closeSheets()">✕</button></div>
    <div class="tiny muted mb">${sub} · ${keys.length} words</div>
    ${keys.length ? letters.map(L => `<div class="cap mt mb">${L}</div>${groups[L].map(k => wordRow(k)).join('')}`).join('')
      : '<div class="card tc muted sm mt">Nothing here yet.</div>'}
    <div style="height:10px"></div>`);
}

/* ---------- the word card ---------- */
function openWord(word) {
  const k = normalise(word);
  const local = lookupLocal(k);
  if (local) return renderWord(local, k);
  if (FORMS[k]) {
    const b = FORMS[k];
    toast('"' + esc(word) + '" is a form of <b>' + esc(DICT[b].w) + '</b>');
    return renderWord(DICT[b], b);
  }
  const d = sheet(`<div class="tc" style="padding:26px 0">
    <div style="font-size:34px">🌐</div>
    <b style="display:block;margin-top:8px">Looking up "${esc(word)}"…</b>
    <div class="tiny muted mt">Checking the online dictionary</div></div>`);
  onlineLookup(k)
    .then(ent => { d.remove(); renderWord(ent, k); })
    .catch(() => {
      d.remove();
      const near = dictSearch(k, 6);
      sheet(`<div class="row sb"><b style="font-size:19px">Not found</b>
          <button class="iconbtn" onclick="closeSheets()">✕</button></div>
        <div class="card mt tc sm muted" style="line-height:1.6">
          No entry for "<b style="color:var(--txt)">${esc(word)}</b>".<br>
          Either the spelling is different, or you are offline and this word is not in the built-in ${DICT_COUNT}-word dictionary.</div>
        ${near.length ? `<div class="cap mt2 mb">Did you mean…</div>${near.map(x => wordRow(x)).join('')}` : ''}`);
    });
}

function renderWord(e, k) {
  const saved = isSaved(k);
  const lvl = (e.t || []).find(t => /^[ABC][12]$/.test(t));
  const tagNames = { irr: 'Irregular verb', phr: 'Phrasal verb', conf: 'Easily confused', gram: 'Grammar term', fn: 'Function word', core: 'Everyday word', online: 'From the online dictionary' };
  const chips = (e.t || []).filter(t => tagNames[t]).map(t =>
    `<span class="badgeL" style="background:rgba(124,92,255,.18);color:#c9bfff">${tagNames[t]}</span>`).join(' ');
  const topicLink = relatedTopic(e);

  sheet(`
    <div class="row sb">
      <div class="row" style="gap:8px">${lvl ? `<span class="badgeL" style="background:rgba(25,227,255,.16);color:var(--c2)">${lvl}</span>` : ''}${chips}</div>
      <button class="iconbtn" onclick="closeSheets()">✕</button>
    </div>
    <div class="row mt" style="gap:11px;align-items:flex-start">
      <div class="grow" style="min-width:0">
        <h2 style="margin:4px 0 2px;font-size:30px;letter-spacing:-.02em;word-break:break-word">${esc(e.w)}</h2>
        <div class="sm muted" style="font-style:italic">${esc(e.p || '')}${e.fm && /^\//.test(e.fm) ? ' · ' + esc(e.fm) : ''}</div>
      </div>
      <button class="iconbtn" title="Hear it" onclick="speakWord('${esc(e.w).replace(/'/g, "\\'")}')">🔊</button>
      <button class="iconbtn" id="savBtn" title="Save" onclick="afterSave(toggleSave('${k.replace(/'/g, "\\'")}'))"
        style="${saved ? 'background:rgba(255,212,112,.2);border-color:rgba(255,212,112,.5)' : ''}">${saved ? '⭐' : '☆'}</button>
    </div>

    <div class="lesson" style="margin-top:4px">
      <h4>Meaning</h4>
      <p>${e.d || '—'}</p>
      ${(e.more || []).length ? (e.more).map(m => `<p class="muted">${esc(m)}</p>`).join('') : ''}
      ${e.fm && !/^\//.test(e.fm) ? `<h4>Forms</h4><div class="ex"><em>${esc(e.w)}</em> · ${esc(e.fm)}</div>` : ''}
      ${(e.e || []).length ? `<h4>Examples</h4>${e.e.map(x => `<div class="ex">${x}</div>`).join('')}` : ''}
      ${(e.s || []).length ? `<h4>Similar words</h4><div class="row wrap" style="gap:6px">${e.s.map(s =>
        `<button class="chip" style="font-size:13px;padding:8px 11px" onclick="closeSheets();openWord('${esc(s).replace(/'/g, "\\'")}')">${esc(s)}</button>`).join('')}</div>` : ''}
      ${e.n ? `<h4>Watch out</h4><div class="ex" style="border-color:var(--warn);background:rgba(255,197,61,.08)">${e.n}</div>` : ''}
    </div>

    ${topicLink ? `<button class="btn full mt" onclick="closeSheets();openTopic('${topicLink.id}')">
      ${topicLink.em} Practise: ${esc(topicLink.name)}</button>` : ''}
    <button class="btn ${saved ? '' : 'pri'} full" style="margin-top:8px"
      onclick="afterSave(toggleSave('${k.replace(/'/g, "\\'")}'));closeSheets()">
      ${saved ? 'Remove from my words' : '⭐ Save to my words'}</button>
    ${e.online ? '<div class="tiny muted tc mt" style="margin-top:9px">Definition from the free Dictionary API · now stored offline</div>' : ''}
    <div style="height:10px"></div>`);
}
function afterSave(nowSaved) {
  const b = $('#savBtn');
  if (b) { b.textContent = nowSaved ? '⭐' : '☆'; b.style.background = nowSaved ? 'rgba(255,212,112,.2)' : ''; }
}
function relatedTopic(e) {
  const t = e.t || [];
  if (t.indexOf('irr') >= 0) return TMAP['pastsimple'];
  if (t.indexOf('irrplural') >= 0) return TMAP['plural'];
  if (t.indexOf('gram') >= 0) {
    const n = e.w.toLowerCase();
    const hit = TOPICS.find(x => x.name.toLowerCase().indexOf(n) >= 0);
    if (hit) return hit;
  }
  if (t.indexOf('fn') >= 0 && e.p === 'preposition') return TMAP['prep-place'];
  if (t.indexOf('fn') >= 0 && e.p === 'determiner') return TMAP['article'];
  if (t.indexOf('fn') >= 0 && e.p === 'conjunction') return TMAP['linkers'];
  return null;
}

/* ---------- flashcards ---------- */
let FC = null;
function startFlashcards() {
  const q = shuffle(dueWords()).slice(0, 20);
  if (!q.length) { toast('Nothing to review right now'); return; }
  FC = { q, i: 0, right: 0, wrong: 0, xp0: S.xp, shown: false };
  const w = document.createElement('div');
  w.id = 'quizwrap';
  w.innerHTML = '<div class="inner"><div id="fcbody" class="grow"></div></div>';
  document.body.appendChild(w);
  document.body.style.overflow = 'hidden';
  fcShow();
}
function fcQuit() {
  const w = $('#quizwrap'); if (w) w.remove();
  document.body.style.overflow = '';
  FC = null; go('words');
}
function fcShow() {
  if (FC.i >= FC.q.length) return fcDone();
  FC.shown = false;
  const k = FC.q[FC.i];
  const e = lookupLocal(k) || { w: k, d: '', e: [], p: '' };
  const rec = S.saved[k] || { b: 1 };
  $('#fcbody').innerHTML = `
    <div class="row" style="gap:10px">
      <button class="iconbtn" onclick="fcQuit()">✕</button>
      <div class="qbar"><i style="width:${Math.round(FC.i / FC.q.length * 100)}%"></i></div>
      <span class="tiny muted mono">${FC.i + 1}/${FC.q.length}</span>
    </div>
    <div class="row sb mt"><span class="cap">Flashcards</span>
      <span class="tiny muted">Box ${rec.b} · ${'●'.repeat(rec.b)}${'○'.repeat(Math.max(0, 5 - rec.b))}</span></div>

    <div class="card glow tc" style="margin-top:22px;padding:30px 16px">
      <h2 style="margin:0;font-size:34px;letter-spacing:-.02em;word-break:break-word">${esc(e.w)}</h2>
      <div class="sm muted" style="font-style:italic;margin-top:4px">${esc(e.p || '')}</div>
      <button class="btn sm mt" style="margin-top:14px" onclick="speakWord('${esc(e.w).replace(/'/g, "\\'")}')">🔊 Hear it</button>
    </div>

    <div id="fcback" class="hide">
      <div class="card mt"><div class="cap mb">Meaning</div>
        <p style="margin:0;font-size:15px;line-height:1.6">${e.d || '—'}</p>
        ${(e.e || []).length ? `<div class="ex" style="margin-top:10px">${e.e[0]}</div>` : ''}
        ${e.fm ? `<div class="tiny muted" style="margin-top:8px">Forms: ${esc(e.fm)}</div>` : ''}
        ${e.n ? `<div class="tiny muted" style="margin-top:6px">${e.n}</div>` : ''}
      </div>
      <div class="row mt" style="gap:9px">
        <button class="btn grow" style="border-color:rgba(255,84,112,.5)" onclick="fcAnswer(false)">Again 🔁</button>
        <button class="btn cy grow" onclick="fcAnswer(true)">I knew it ✓</button>
      </div>
      <button class="btn full" style="margin-top:8px" onclick="closeSheets();openWord('${k.replace(/'/g, "\\'")}')">Open full word card</button>
    </div>
    <button class="btn pri full mt" id="fcReveal" onclick="fcReveal()">Show meaning</button>`;
}
function fcReveal() {
  FC.shown = true;
  $('#fcback').classList.remove('hide');
  const b = $('#fcReveal'); if (b) b.classList.add('hide');
}
function fcAnswer(ok) {
  const k = FC.q[FC.i];
  const rec = S.saved[k];
  if (rec) {
    if (ok) { rec.b = Math.min(6, (rec.b || 1) + 1); rec.r = (rec.r || 0) + 1; rec.due = nextDue(rec.b); }
    else { rec.b = 1; rec.w = (rec.w || 0) + 1; rec.due = todayKey(); FC.q.push(k); }
  }
  recordWordReview(ok);
  if (ok) { FC.right++; beep('ok'); buzz(12); } else { FC.wrong++; beep('bad'); }
  FC.i++;
  paintTop();
  fcShow();
}
function fcDone() {
  const gained = S.xp - FC.xp0;
  const total = FC.right + FC.wrong;
  if (FC.right && FC.right >= total * .8) setTimeout(confetti, 200);
  checkAch(); save();
  $('#fcbody').innerHTML = `
    <div class="tc" style="padding-top:34px">
      <div style="font-size:56px">${FC.right >= total * .8 ? '🌟' : '📚'}</div>
      <h2 style="margin:6px 0 2px;font-size:26px">Review finished</h2>
      <div class="muted sm">${FC.right} known · ${FC.wrong} to repeat</div>
    </div>
    <div class="row mt2" style="gap:9px">
      <div class="stat"><b class="mono">+${gained}</b><span>XP</span></div>
      <div class="stat"><b class="mono">${savedList().length}</b><span>Saved words</span></div>
      <div class="stat"><b class="mono">${dueWords().length}</b><span>Still due</span></div>
    </div>
    <div class="card mt sm muted tc" style="line-height:1.6">
      Words you knew come back later and later: tomorrow, then in 2, 4, 8, 16 and 32 days.
      Words you missed come back today.</div>
    <div class="row mt2" style="gap:9px">
      <button class="btn grow" onclick="fcQuit()">Done</button>
      ${dueWords().length ? '<button class="btn pri grow" onclick="fcMore()">Review more →</button>' : ''}
    </div>`;
}
function fcMore() {
  const w = $('#quizwrap'); if (w) w.remove();
  document.body.style.overflow = '';
  FC = null; startFlashcards();
}

/* extra badges for vocabulary work */
ACH.push(
  { id: 'w10', e: '📖', n: 'Word Collector', d: 'Save 10 words', test: s => savedList().length >= 10 },
  { id: 'w50', e: '📚', n: 'Vocabulary Builder', d: 'Save 50 words', test: s => savedList().length >= 50 },
  { id: 'wrev100', e: '🃏', n: 'Card Shark', d: '100 flashcard reviews', test: s => ((s.wstats || {}).rev || 0) >= 100 },
  { id: 'wbox', e: '🧠', n: 'Locked In', d: 'Get 5 words to the final box', test: s => savedList().filter(w => (s.saved[w].b || 1) >= 6).length >= 5 }
);


/* ==========================================================================
   11. BOOT
   ========================================================================== */

$('#setBtn').onclick = openSettings;
$('#avaBtn').onclick = openProfiles;
$('#dictBtn').onclick = () => {
  go('words');
  setTimeout(() => { const el = $('#wsearch'); if (el) el.focus(); }, 120);
};
function clearWordCache() {
  if (!confirm('Clear the words downloaded from the online dictionary? The built-in ' + DICT_COUNT + ' words stay.')) return;
  WCACHE = {}; LS.set(WCACHE_KEY, {}); closeSheets(); toast('Online word cache cleared');
}

document.addEventListener('keydown', e => {
  if (!Qz || Qz.done || Qz.answered) {
    if (!Qz && e.key === 'Escape') closeSheets();
    return;
  }
  if (Qz.q && Qz.q.type === 'mcq') {
    const i = 'abcd'.indexOf(e.key.toLowerCase());
    if (i >= 0) { const b = $$('#opts .opt')[i]; if (b) answerMcq(b); }
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 4) { const b = $$('#opts .opt')[n - 1]; if (b) answerMcq(b); }
  }
});
document.addEventListener('keydown', e => {
  if (Qz && Qz.answered && !Qz.done && e.key === 'Enter') { e.preventDefault(); nextStep(); }
});

/* a gentle nudge the first time */
if (!LS.get('gq_seen_intro', false)) {
  LS.set('gq_seen_intro', true);
  setTimeout(() => {
    sheet(`<div class="tc">
      <div style="font-size:52px">🚀</div>
      <h2 style="margin:6px 0 4px;font-size:25px">Welcome to GrammarQuest</h2>
      <p class="sm muted" style="line-height:1.7;margin:0 0 16px">
        ${TOPICS.length} grammar topics from elementary to proficiency.<br>
        Questions are generated fresh every single time — you will never run out.</p></div>
      <div class="card tc mb"><b>📖 Learn</b><div class="tiny muted">Read the rule, then drill it</div></div>
      <div class="card tc mb"><b>⚡ Practice</b><div class="tiny muted">Adaptive — your weak topics come back more often</div></div>
      <div class="card tc mb"><b>🎮 Play</b><div class="tiny muted">Speed Round, Survival, Word Builder, Error Hunt, Ladder</div></div>
      <div class="card tc mb"><b>📖 Words</b><div class="tiny muted">Built-in dictionary, saved words and flashcards</div></div>
      <div class="card tc mb"><b>🔥 Daily</b><div class="tiny muted">One challenge a day keeps the streak alive</div></div>
      <button class="btn pri full mt" onclick="closeSheets();openSettings()">Set my name &amp; goal</button>
      <button class="btn full" style="margin-top:8px" onclick="closeSheets()">Start straight away</button>`);
  }, 500);
}

checkAch();
paintTop();
go('home');

/* home-screen shortcuts: index.html?go=daily | practice | speed */
(function () {
  const g = new URLSearchParams(location.search).get('go');
  if (!g) return;
  setTimeout(() => {
    if (g === 'daily') startDaily();
    else if (g === 'words') { go('words'); const el = $('#wsearch'); if (el) el.focus(); }
    else if (g === 'review') startFlashcards();
    else if (g === 'practice') quickPractice(10);
    else if (g === 'speed') gameSpeed();
    else if (g === 'play') go('play');
  }, 350);
})();

/* PWA: install + offline. Harmless if the files are missing. */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => { });
  });
}
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt = e;
  setTimeout(() => {
    if (!LS.get('gq_install_asked', false) && totalAnswered() > 10) {
      LS.set('gq_install_asked', true);
      toast('📲 Tip: add GrammarQuest to your home screen');
    }
  }, 3000);
});
</script>
