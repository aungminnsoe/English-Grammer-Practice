<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07070f">
<meta name="description" content="GrammarQuest - unlimited English grammar practice from elementary to advanced.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GrammarQuest">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>GrammarQuest</title>
<style>
/* ============================================================
   GrammarQuest - theme
   ============================================================ */
:root{
  --bg:#07070f;
  --bg2:#0d0d1c;
  --card:rgba(255,255,255,.045);
  --card2:rgba(255,255,255,.075);
  --line:rgba(255,255,255,.09);
  --txt:#eef0ff;
  --dim:#9a9ec4;
  --dim2:#6f739b;
  --c1:#7c5cff;   /* violet */
  --c2:#19e3ff;   /* cyan   */
  --c3:#ff3dcb;   /* pink   */
  --ok:#2be08b;
  --bad:#ff5470;
  --warn:#ffc53d;
  --gold:#ffd470;
  --r:18px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --nav-h:68px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:'Segoe UI',system-ui,-apple-system,"Helvetica Neue",Roboto,sans-serif;
  overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(900px 600px at 10% -10%,rgba(124,92,255,.30),transparent 60%),
    radial-gradient(800px 500px at 110% 10%,rgba(25,227,255,.18),transparent 55%),
    radial-gradient(700px 600px at 50% 110%,rgba(255,61,203,.16),transparent 60%),
    var(--bg);
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(255,255,255,.055) 1px,transparent 1px);
  background-size:26px 26px;
  mask-image:linear-gradient(180deg,#000,transparent 70%);
  -webkit-mask-image:linear-gradient(180deg,#000,transparent 70%);
}
#app{max-width:540px;margin:0 auto;min-height:100%;position:relative;
  padding:calc(var(--safe-t) + 4px) 14px calc(var(--nav-h) + var(--safe-b) + 22px)}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font-family:inherit}
::-webkit-scrollbar{width:0;height:0}

/* ---------- utility ---------- */
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column}
.sb{justify-content:space-between}
.ctr{justify-content:center}
.wrap{flex-wrap:wrap}
.grow{flex:1}
.mt{margin-top:14px}.mt2{margin-top:22px}.mb{margin-bottom:12px}
.hide{display:none!important}
.tc{text-align:center}
.muted{color:var(--dim)}
.tiny{font-size:11px}
.sm{font-size:13px}
.b{font-weight:800}
.mono{font-variant-numeric:tabular-nums}
.grad{background:linear-gradient(100deg,var(--c2),var(--c1) 45%,var(--c3));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.cap{text-transform:uppercase;letter-spacing:.14em;font-size:10.5px;color:var(--dim2);font-weight:800}

/* ---------- cards ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 10px 30px -18px #000;
}
.card.glow{box-shadow:0 0 0 1px rgba(124,92,255,.25),0 16px 46px -22px rgba(124,92,255,.85)}
.card.pad0{padding:0;overflow:hidden}

/* ---------- top bar ---------- */
#top{display:flex;align-items:center;gap:10px;padding:8px 2px 12px;position:sticky;top:0;z-index:30;
  background:linear-gradient(180deg,rgba(7,7,15,.95),rgba(7,7,15,.78) 65%,transparent);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);margin:0 -4px}
.ava{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:19px;
  background:linear-gradient(145deg,var(--c1),var(--c3));box-shadow:0 6px 20px -8px var(--c1);flex:none}
.lvlchip{font-size:10px;font-weight:900;letter-spacing:.06em;padding:2px 7px;border-radius:99px;
  background:linear-gradient(90deg,var(--c1),var(--c3));color:#fff}
.xpbar{height:7px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:5px}
.xpbar>i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--c2),var(--c1),var(--c3));
  box-shadow:0 0 12px rgba(124,92,255,.8);transition:width .6s cubic-bezier(.2,.9,.2,1)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:7px 11px;border-radius:99px;
  background:var(--card2);border:1px solid var(--line);font-size:12.5px;font-weight:800;white-space:nowrap}
.pill.fire{color:var(--warn);border-color:rgba(255,197,61,.35);background:rgba(255,197,61,.1)}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:17px;
  background:var(--card2);border:1px solid var(--line);flex:none}
.iconbtn:active{transform:scale(.92)}

/* ---------- bottom nav ---------- */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;
  padding:0 10px calc(var(--safe-b) + 9px);pointer-events:none}
#nav .inner{pointer-events:auto;display:flex;width:100%;max-width:512px;gap:2px;
  background:rgba(13,13,28,.86);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--line);border-radius:22px;padding:7px 6px;box-shadow:0 -8px 40px -14px #000}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;
  border-radius:16px;font-size:9.5px;font-weight:800;color:var(--dim2);letter-spacing:.04em;transition:.2s}
#nav button i{font-style:normal;font-size:19px;line-height:1;filter:grayscale(1) opacity(.65);transition:.2s}
#nav button.on{color:#fff;background:linear-gradient(160deg,rgba(124,92,255,.3),rgba(255,61,203,.16))}
#nav button.on i{filter:none;transform:translateY(-1px) scale(1.12)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 18px;border-radius:15px;font-weight:800;font-size:14.5px;
  background:var(--card2);border:1px solid var(--line);transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.pri{background:linear-gradient(100deg,var(--c1),var(--c3));border-color:transparent;color:#fff;
  box-shadow:0 12px 32px -14px var(--c1)}
.btn.cy{background:linear-gradient(100deg,#0ea9c9,var(--c2));border-color:transparent;color:#01222b;
  box-shadow:0 12px 32px -14px var(--c2)}
.btn.gold{background:linear-gradient(100deg,#f0a93c,var(--gold));border-color:transparent;color:#2b1c00;
  box-shadow:0 12px 32px -14px var(--gold)}
.btn.full{width:100%}
.btn.sm{padding:9px 13px;font-size:12.5px;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- level ring ---------- */
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .mid b{font-size:31px;display:block;letter-spacing:-.02em}

/* ---------- home tiles ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.tile{position:relative;border-radius:var(--r);padding:15px;overflow:hidden;
  border:1px solid var(--line);background:var(--card);text-align:left;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile .em{font-size:25px;display:block;margin-bottom:7px}
.tile b{font-size:14.5px;display:block}
.tile span{font-size:11.5px;color:var(--dim);display:block;margin-top:2px}
.tile::after{content:"";position:absolute;inset:0;opacity:.6;pointer-events:none;
  background:radial-gradient(130px 80px at 110% -20%,var(--tc,rgba(124,92,255,.5)),transparent 70%)}
.tile.wide{grid-column:1/-1}

/* ---------- lists ---------- */
.lvlhead{display:flex;align-items:center;gap:9px;margin:20px 0 9px}
.badgeL{font-size:10.5px;font-weight:900;padding:4px 9px;border-radius:8px;letter-spacing:.08em}
.topic{display:flex;align-items:center;gap:11px;padding:12px;border-radius:15px;
  background:var(--card);border:1px solid var(--line);margin-bottom:8px;width:100%;text-align:left;transition:.15s}
.topic:active{transform:scale(.98)}
.topic .n{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;
  font-size:12px;font-weight:900;background:var(--card2);color:var(--dim)}
.topic .t{flex:1;min-width:0}
.topic .t b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stars{font-size:10px;letter-spacing:1px;color:var(--dim2)}
.stars .f{color:var(--gold)}
.mini{height:5px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:5px}
.mini>i{display:block;height:100%;background:linear-gradient(90deg,var(--c2),var(--c1))}

/* ---------- quiz ---------- */
#quizwrap{position:fixed;inset:0;z-index:60;background:var(--bg2);overflow-y:auto;
  display:flex;flex-direction:column;animation:slideup .28s cubic-bezier(.2,.9,.2,1)}
@keyframes slideup{from{transform:translateY(22px);opacity:0}to{transform:none;opacity:1}}
#quizwrap .inner{max-width:540px;width:100%;margin:0 auto;padding:calc(var(--safe-t) + 12px) 15px calc(var(--safe-b) + 20px);
  flex:1;display:flex;flex-direction:column}
.qbar{height:9px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden;flex:1}
.qbar>i{display:block;height:100%;border-radius:99px;transition:width .35s;
  background:linear-gradient(90deg,var(--c2),var(--c1),var(--c3))}
.hearts{font-size:15px;letter-spacing:1px}
.stem{font-size:21.5px;line-height:1.55;font-weight:700;margin:16px 0 4px;letter-spacing:-.01em}
.stem u{text-decoration:none;color:var(--c2);border-bottom:2.5px dashed rgba(25,227,255,.55);padding:0 4px}
.opt{display:block;width:100%;text-align:left;padding:15px 16px;border-radius:15px;margin-bottom:9px;
  background:var(--card);border:1.5px solid var(--line);font-size:15.5px;font-weight:700;transition:.15s}
.opt:active{transform:scale(.985)}
.opt.ok{background:rgba(43,224,139,.16);border-color:var(--ok);color:#b8ffdc}
.opt.no{background:rgba(255,84,112,.15);border-color:var(--bad);color:#ffc5ce}
.opt .k{display:inline-block;width:22px;color:var(--dim2);font-weight:900;font-size:12px}
.fb{border-radius:16px;padding:14px;margin-top:4px;animation:pop .25s}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:none;opacity:1}}
.fb.ok{background:rgba(43,224,139,.13);border:1px solid rgba(43,224,139,.4)}
.fb.no{background:rgba(255,84,112,.12);border:1px solid rgba(255,84,112,.4)}
.fb>b{font-size:15px;display:block;margin-bottom:5px}
.fb p{margin:0;font-size:13.5px;line-height:1.6;color:#d6d9f5}
.fb p b{color:#fff}
.fb s{color:var(--bad);opacity:.8}
.tin{width:100%;padding:15px 16px;border-radius:15px;background:var(--card);border:1.5px solid var(--line);
  color:var(--txt);font-size:17px;font-weight:700;outline:none}
.tin:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(124,92,255,.2)}
.chip{padding:11px 14px;border-radius:13px;background:var(--card2);border:1px solid var(--line);
  font-size:15px;font-weight:700;transition:.12s}
.chip:active{transform:scale(.93)}
.chip.used{opacity:.22;pointer-events:none}
.slot{min-height:56px;border-radius:15px;border:1.5px dashed var(--line);padding:9px;
  display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;background:rgba(255,255,255,.02)}
.combo{position:fixed;top:calc(var(--safe-t) + 60px);left:50%;transform:translateX(-50%);z-index:70;
  font-size:26px;font-weight:900;pointer-events:none;animation:cfly .9s ease-out forwards;
  text-shadow:0 0 22px rgba(255,197,61,.9)}
@keyframes cfly{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}
  25%{opacity:1;transform:translate(-50%,-4px) scale(1.14)}
  70%{opacity:1}100%{opacity:0;transform:translate(-50%,-34px) scale(1)}}
.timerbig{font-size:14px;font-weight:900;font-variant-numeric:tabular-nums}
.timerbig.low{color:var(--bad);animation:blink .7s infinite}
@keyframes blink{50%{opacity:.35}}

/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dh{text-align:center;font-size:9.5px;color:var(--dim2);font-weight:800;padding-bottom:2px}
.cal .d{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:700;
  background:rgba(255,255,255,.045);color:var(--dim2);border:1px solid transparent;position:relative}
.cal .d.l1{background:rgba(124,92,255,.28);color:#fff}
.cal .d.l2{background:rgba(124,92,255,.52);color:#fff}
.cal .d.l3{background:linear-gradient(145deg,var(--c1),var(--c3));color:#fff;box-shadow:0 0 14px -4px var(--c1)}
.cal .d.l4{background:linear-gradient(145deg,var(--c2),var(--c1));color:#021;box-shadow:0 0 18px -3px var(--c2)}
.cal .d.today{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn)}
.cal .d.pad{opacity:0}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow:hidden}
.heat i{width:100%;aspect-ratio:1;border-radius:3px;background:rgba(255,255,255,.06)}

/* ---------- badges ---------- */
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.bg{border-radius:15px;padding:11px 7px;text-align:center;background:var(--card);border:1px solid var(--line);
  opacity:.4;filter:grayscale(1)}
.bg.got{opacity:1;filter:none;background:linear-gradient(160deg,rgba(255,212,112,.16),rgba(124,92,255,.1));
  border-color:rgba(255,212,112,.35)}
.bg .e{font-size:23px;display:block}
.bg b{font-size:10.5px;display:block;margin-top:4px;line-height:1.25}

/* ---------- misc ---------- */
.stat{flex:1;text-align:center;padding:11px 5px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.stat b{display:block;font-size:20px;letter-spacing:-.02em}
.stat span{font-size:10px;color:var(--dim2);font-weight:800;text-transform:uppercase;letter-spacing:.07em}
.sheet{position:fixed;inset:0;z-index:80;background:rgba(3,3,10,.72);backdrop-filter:blur(7px);
  display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet .box{width:100%;max-width:540px;background:var(--bg2);border:1px solid var(--line);
  border-radius:24px 24px 0 0;padding:20px 16px calc(var(--safe-b) + 20px);max-height:88vh;overflow-y:auto;
  animation:slideup .28s cubic-bezier(.2,.9,.2,1)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + var(--safe-b) + 18px);
  z-index:90;background:rgba(20,20,40,.96);border:1px solid var(--line);border-radius:14px;
  padding:11px 16px;font-size:13px;font-weight:700;box-shadow:0 14px 40px -14px #000;animation:tst .3s;max-width:88%}
@keyframes tst{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
#cfx{position:fixed;inset:0;z-index:100;pointer-events:none}
.lesson h4{margin:16px 0 7px;font-size:14px;color:var(--c2)}
.lesson p{margin:0 0 8px;font-size:14px;line-height:1.65;color:#d8dbf5}
.ex{background:rgba(25,227,255,.07);border-left:3px solid var(--c2);border-radius:0 11px 11px 0;
  padding:9px 12px;margin:7px 0;font-size:13.5px;line-height:1.55}
.ex em{color:var(--c2);font-style:normal;font-weight:800}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
.tabs button{flex:1;padding:9px;border-radius:11px;font-size:12.5px;font-weight:800;color:var(--dim)}
.tabs button.on{background:linear-gradient(100deg,var(--c1),var(--c3));color:#fff}
.sw{width:46px;height:27px;border-radius:99px;background:rgba(255,255,255,.14);position:relative;flex:none;transition:.2s}
.sw>i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:linear-gradient(90deg,var(--c1),var(--c3))}
.sw.on>i{left:22px}
.srow{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
#nav button{font-size:8.6px}
#nav button i{font-size:18px}
@media (min-width:420px){#nav button{font-size:9.4px}#nav button i{font-size:19px}}
@media (max-width:360px){.stem{font-size:19px}.tile b{font-size:13.5px}
  #nav button{font-size:8px;padding:7px 0}#nav .inner{padding:6px 4px}}
#wsearch::placeholder{color:var(--dim2)}
#wsearch:focus{box-shadow:none}
.lesson h4:first-child{margin-top:6px}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button class="ava" id="avaBtn">🦊</button>
    <div class="grow" style="min-width:0">
      <div class="row" style="gap:7px">
        <b id="uname" style="font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Learner</b>
        <span class="lvlchip" id="lvlChip">LV 1</span>
      </div>
      <div class="xpbar"><i id="xpFill" style="width:0%"></i></div>
    </div>
    <div class="pill fire" id="streakPill">🔥 0</div>
    <button class="iconbtn" id="dictBtn" title="Dictionary">🔍</button>
    <button class="iconbtn" id="setBtn">⚙️</button>
  </div>
  <div id="view"></div>
</div>
<nav id="nav"><div class="inner">
  <button data-v="home" class="on"><i>🏠</i>HOME</button>
  <button data-v="learn"><i>📚</i>LEARN</button>
  <button data-v="practice"><i>✍️</i>PRACTICE</button>
  <button data-v="play"><i>🎮</i>PLAY</button>
  <button data-v="words"><i>📖</i>WORDS</button>
  <button data-v="stats"><i>📊</i>STATS</button>
</div></nav>
<canvas id="cfx"></canvas>
<script>
/* ==========================================================================
   GrammarQuest  -  unlimited English grammar trainer
   Single file. No build step. Works offline. Data stays on your device.
   ========================================================================== */
'use strict';

/* ---------- tiny helpers ---------- */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const pick = a => a[Math.floor(Math.random() * a.length)];
const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const uniq = a => Array.from(new Set(a));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const low = s => s.charAt(0).toLowerCase() + s.slice(1);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function pickN(arr, n, not) {
  const pool = shuffle(arr.filter(x => !not || !not.includes(x)));
  return pool.slice(0, n);
}
function sample(arr, n) { return shuffle(arr).slice(0, n); }
function todayKey(d) { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function dateFromKey(k) { const p = k.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function daysBetween(a, b) { return Math.round((dateFromKey(b) - dateFromKey(a)) / 86400000); }

/* ==========================================================================
   1. WORD BANKS  -  the raw material the generators recombine
   ========================================================================== */

const SUBJ = [
  { n: 'I',    be: 'am',  wa: 'was',  hv: 'have', sg: false, o: 'me',   p: 'my',    r: 'myself' },
  { n: 'You',  be: 'are', wa: 'were', hv: 'have', sg: false, o: 'you',  p: 'your',  r: 'yourself' },

];

/* last-resort extra wrong options, so every item can always show 4 choices */
function padDistractors(ans, have) {
  const w = String(ans).split(' ');
  const last = w[w.length - 1], pre = w.slice(0, -1).join(' ');
  const J = x => (pre ? pre + ' ' : '') + x;
  const cands = [
    J(last + 's'), J(last.replace(/e$/, '') + 'ing'), J(last + 'ed'),
    'to ' + ans, 'is ' + ans, 'was ' + ans, 'have ' + ans, 'be ' + ans, 'did ' + ans
  ];
  const out = have.slice();
  for (const c of cands) {
    if (out.length >= 3) break;
    if (c !== ans && !out.includes(c)) out.push(c);
  }
  return out;
}

function mk(stem, answer, distractors, sentence, explain, alt) {
  let ds = uniq(distractors).filter(d => d && d !== answer).slice(0, 3);
  if (ds.length < 3) ds = padDistractors(answer, ds);
  return {
    stem,
    answer,
    distractors: ds,
    sentence: sentence || stem.replace('___', answer),
    explain,
    alt: alt || []
  };
}

topic({

topic({

topic({

topic({
  id: 'passive', lvl: 'B1', em: '🔄', name: 'Passive voice (present & past)',
  why: ['<b>be + past participle</b>. The object becomes the subject.',
        'Present: is / are + participle. Past: was / were + participle.',
        'Use <b>by</b> only when the doer matters.'],
  ex: ['The office <em>is cleaned</em> every day.', 'The letters <em>were sent</em> yesterday.', 'This bridge <em>was built</em> in 1890.'],
  gen() {
    const v = pick(VPASS), past = Math.random() < .5, plural = Math.random() < .4;

    const n = plural ? 'The rooms' : 'The room';
    if (Math.random() < .5) {
      return mk(`${n} ___ ${v.pp} ${past ? 'last week' : 'every day'}.`, be, ['is', 'are', 'was', 'were'], null,
        `${plural ? 'Plural' : 'Singular'} subject + ${past ? 'past' : 'present'} → <b>${be}</b> + past participle.`);
    }
    return mk(`${n} ${be} ___ ${past ? 'yesterday' : 'regularly'}.`, v.pp, [v.b, v.p, v.pp, v.g], null,
      `The passive needs the <b>past participle</b>: ${v.b} → <b>${v.pp}</b>.`);
  }
});

topic({

topic({

topic({

topic({
  id: 'gerinf', lvl: 'B1', em: '🔀', name: 'Gerund or infinitive',
  why: ['After <b>enjoy, finish, avoid, suggest, mind, practise, can\'t stand</b> → <b>-ing</b>.',
        'After <b>want, decide, hope, promise, agree, offer, learn, afford</b> → <b>to + verb</b>.',
        'After a preposition → always <b>-ing</b>.'],
  ex: ['I enjoy <em>reading</em>.', 'She decided <em>to leave</em>.', 'He is good at <em>cooking</em>.'],
  gen() {
    const ing = ['enjoy', 'finish', 'avoid', 'suggest', 'mind', 'practise', 'imagine', "can't stand"];
    const inf = ['want', 'decide', 'hope', 'promise', 'agree', 'offer', 'learn', 'refuse', 'manage'];
    const v = pick(V);
    const r = Math.random();
    if (r < .4) {
      const w = pick(ing);
      return mk(`They ${w} ___ ${v.c}.`, v.g, [v.b, v.g, 'to ' + v.b, v.p], null,
        `"${w}" is followed by the <b>-ing</b> form: <b>${v.g}</b>.`);
    }
    if (r < .8) {
      const w = pick(inf);
      return mk(`They ${w}ed ___ ${v.c}.`.replace('eed', 'ed'), 'to ' + v.b, [v.b, v.g, 'to ' + v.b, v.p], null,
        `"${w}" is followed by the <b>to-infinitive</b>: <b>to ${v.b}</b>.`);
    }
    return mk(`She's interested in ___ ${v.c}.`, v.g, [v.b, v.g, 'to ' + v.b, v.pp], null,
      `After a <b>preposition</b> (in) we always use the -ing form: <b>${v.g}</b>.`);
  }
});

  ex: ['You <em>should have told</em> me.', 'He <em>must have forgotten</em>.', 'She <em>can\'t have seen</em> us.'],
  gen() {
    const r = Math.random();
    if (r < .3) return mk(`You ___ me — I would have helped!`, 'should have told',

      `Criticism about the past → <b>should have + past participle</b>.`);
    if (r < .6) return mk(`The lights are off — they ___ home.`, 'must have gone',
      ['must have gone', "can't have gone", 'must go', 'should have gone'], null,
      `Confident conclusion about the past → <b>must have + participle</b>.`);
    return mk(`He ___ the message; his phone was off all day.`, "can't have seen",
      ["can't have seen", "mustn't have seen", "can't see", 'must have seen'], null,
      `Certain it did NOT happen → <b>can't have + participle</b>.`);
  }
});

topic({

topic({

/* ==========================================================================
   3. QUESTION FACTORY  -  one generator, five exercise formats
   ========================================================================== */

const TMAP = {};
TOPICS.forEach(t => { TMAP[t.id] = t; });
const BY_LEVEL = {};
LEVELS.forEach(l => { BY_LEVEL[l.id] = TOPICS.filter(t => t.lvl === l.id); });

/* can this raw item be turned into a word-order / error-hunt task? */
function orderable(raw) {
  const s = raw.sentence;
  if (!s || !raw.stem || raw.stem.indexOf('___') < 0) return false;
  if (/[()\[\]—"“]|___|\.\.\./.test(s)) return false;
  if (/→/.test(s)) return false;
  const n = s.split(' ').length;
  return n >= 4 && n <= 12;
}
/* word-order also needs a sentence with no internal punctuation */
function canOrder(raw) { return orderable(raw) && !/[,;:]/.test(raw.sentence); }

/* build a displayable question of a given format */
function buildQ(topicId, format) {
  const t = TMAP[topicId];
  const want = format && format !== 'auto' ? format : null;
  let raw = null;
  for (let i = 0; i < 14; i++) {
    const cand = t.gen();
    if (!cand || !cand.answer || cand.distractors.length < 2) continue;
    raw = cand;
    if (want === 'order' && !canOrder(cand)) { raw = cand; continue; }
    if (want === 'error' && !orderable(cand)) { raw = cand; continue; }
    break;
  }
  if (!raw) raw = t.gen();

  const formats = ['mcq', 'mcq', 'mcq', 'type'];
  if (canOrder(raw)) formats.push('order');
  if (orderable(raw)) formats.push('error');
  const f = want || pick(formats);

  const base = { topic: topicId, topicName: t.name, lvl: t.lvl, explain: raw.explain, raw };

  if (f === 'type') {
    return Object.assign(base, {
      type: 'type',
      prompt: 'Type the missing word(s)',
      stem: raw.stem,
      answer: raw.answer,
      accept: [raw.answer].concat(raw.alt)
    });
  }
  if (f === 'order' && orderable(raw) && !/[,;:]/.test(raw.sentence)) {
    const words = raw.sentence.replace(/[.?!]$/, '').split(' ');
    const end = raw.sentence.slice(-1);
    return Object.assign(base, {
      type: 'order',
      prompt: 'Put the words in the right order',
      words: shuffle(words),
      answer: words.join(' '),
      end: end
    });
  }
  if (f === 'error' && orderable(raw)) {
    /* substitute into the gap itself - never a blind string replace */
    const strip = w => w.replace(/[.,;:!?'"]/g, '').toLowerCase();
    const good = raw.stem.replace('___', raw.answer);
    const goodWords = good.split(' ').map(strip);
    const cands = raw.distractors.filter(d => {
      const b = raw.stem.replace('___', d);
      return b !== good && goodWords.indexOf(strip(d.split(' ')[0])) < 0;
    });
    if (cands.length) {
      const wrong = pick(cands);
      const broken = raw.stem.replace('___', wrong);
      const words = broken.replace(/([.?!])$/, ' $1').split(' ').filter(Boolean);
      const key = strip(wrong.split(' ')[0]);
      const bi = words.findIndex(w => strip(w) === key);
      if (bi >= 0) {
        return Object.assign(base, {
          type: 'error',
          prompt: 'Tap the word that is wrong',
          words: words,
          badIndex: bi,
          badWord: words[bi],
          answer: good,
          wrongPhrase: wrong,
          rightPhrase: raw.answer
        });
      }
    }
  }
  const opts = shuffle([raw.answer].concat(raw.distractors.slice(0, 3)));
  return Object.assign(base, {
    type: 'mcq',
    prompt: 'Choose the correct option',
    stem: raw.stem,
    options: opts,
    answer: raw.answer
  });
}

function normalise(s) {
  return String(s).toLowerCase().trim()
    .replace(/[’`]/g, "'")
    .replace(/[.,!?;:]/g, '')
    .replace(/\s+/g, ' ');
}

/* ==========================================================================
   4. PROFILES, STATE & PROGRESSION
   ========================================================================== */

const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { } }
};

const AVATARS = ['🦊', '🐼', '🦉', '🐯', '🐸', '🐙', '🦄', '🐨', '🦁', '🐳', '🤖', '👾', '🌸', '⚡', '🍀', '🔥'];

function blankState(name, avatar) {
  return {
    v: 1, name: name || 'Learner', avatar: avatar || '🦊', created: todayKey(),

}

function save() { LS.set('gq_d_' + CURID, S); }

/* ---------- levels ---------- */
const RANKS = ['Beginner', 'Learner', 'Explorer', 'Apprentice', 'Scholar', 'Linguist', 'Wordsmith', 'Grammarian', 'Master', 'Virtuoso', 'Sage', 'Legend'];
function levelInfo(xp) {
  let lvl = 1, need = 120, left = xp;
  while (left >= need && lvl < 200) { left -= need; lvl++; need = Math.round(need * 1.14); }
  return { lvl, into: left, need, pct: Math.round(left / need * 100), rank: RANKS[Math.min(RANKS.length - 1, Math.floor((lvl - 1) / 5))] };
}

/* ---------- topic mastery ---------- */
function tstat(id) { return S.topics[id] || (S.topics[id] = { a: 0, c: 0, streak: 0 }); }
function mastery(id) {
  const t = S.topics[id]; if (!t || !t.a) return 0;
  const acc = t.c / t.a;
  const vol = Math.min(1, t.c / 25);
  return Math.round(clamp(acc * 100 * (0.45 + 0.55 * vol), 0, 100));
}
function stars(id) { const m = mastery(id); return m >= 95 ? 5 : m >= 80 ? 4 : m >= 60 ? 3 : m >= 40 ? 2 : m >= 15 ? 1 : 0; }
function levelProgress(lv) {
  const ts = BY_LEVEL[lv]; if (!ts.length) return 0;
  return Math.round(ts.reduce((s, t) => s + mastery(t.id), 0) / ts.length);
}
function overallMastery() { return Math.round(TOPICS.reduce((s, t) => s + mastery(t.id), 0) / TOPICS.length); }

/* ---------- daily log ---------- */
function today() { const k = todayKey(); return S.days[k] || (S.days[k] = { q: 0, c: 0, xp: 0, ms: 0, s: 0 }); }
function touchStreak() {
  const k = todayKey();
  if (S.streak.last === k) return;
  if (S.streak.last && daysBetween(S.streak.last, k) === 1) S.streak.cur++;
  else S.streak.cur = 1;
  S.streak.last = k;
  S.streak.max = Math.max(S.streak.max, S.streak.cur);
}
function streakAlive() {
  if (!S.streak.last) return 0;
  const d = daysBetween(S.streak.last, todayKey());
  return d <= 1 ? S.streak.cur : 0;
}

/* ---------- recording answers ---------- */
let sessionStats = null;
function startSession(mode, meta) {
  sessionStats = { mode, meta: meta || {}, q: 0, c: 0, xp: 0, t0: Date.now(), combo: 0, maxCombo: 0, topics: {} };
}
function recordAnswer(q, ok) {
  const t = tstat(q.topic);
  t.a++; if (ok) { t.c++; t.streak++; } else t.streak = 0;
  const d = today(); d.q++; if (ok) d.c++;
  if (sessionStats) {
    sessionStats.q++;
    if (ok) { sessionStats.c++; sessionStats.combo++; sessionStats.maxCombo = Math.max(sessionStats.maxCombo, sessionStats.combo); }
    else sessionStats.combo = 0;
    sessionStats.topics[q.topic] = true;
  }
  let xp = 0;
  if (ok) {
    xp = 10;
    const lvIdx = LEVELS.findIndex(l => l.id === q.lvl);
    xp += lvIdx * 2;
    if (q.type === 'type') xp += 4;
    if (q.type === 'order') xp += 3;
    if (q.type === 'error') xp += 3;
    if (sessionStats && sessionStats.combo >= 5) xp += 5;
    if (sessionStats && sessionStats.combo >= 10) xp += 5;
    addXp(xp);
  }
  touchStreak();
  save();
  return xp;
}
function addXp(n) {
  const before = levelInfo(S.xp).lvl;
  S.xp += n; today().xp += n;
  if (sessionStats) sessionStats.xp += n;
  const after = levelInfo(S.xp).lvl;
  if (after > before) setTimeout(() => { confetti(); toast('⬆️ Level ' + after + ' — ' + levelInfo(S.xp).rank + '!'); beep('level'); }, 420);
}
function endSession() {
  if (!sessionStats) return null;
  const mins = Math.round((Date.now() - sessionStats.t0) / 60000 * 10) / 10;
  const d = today(); d.ms += Date.now() - sessionStats.t0; d.s++;
  S.hist.unshift({
    t: Date.now(), mode: sessionStats.mode, q: sessionStats.q, c: sessionStats.c,
    xp: sessionStats.xp, combo: sessionStats.maxCombo, meta: sessionStats.meta
  });
  S.hist = S.hist.slice(0, 120);
  const out = Object.assign({}, sessionStats, { mins });
  checkAch();
  save();
  sessionStats = null;
  return out;
}

  { id: 'explorer', e: '🧭', n: 'Explorer', d: 'Practise 25 different topics', test: s => Object.keys(s.topics).length >= 25 },
  { id: 'complete', e: '🏆', n: 'Completionist', d: 'Touch every topic at least once', test: s => Object.keys(s.topics).length >= TOPICS.length },
  { id: 'daily7', e: '📅', n: 'Steady', d: 'Hit your daily goal 7 times', test: s => goalDays() >= 7 },
  { id: 'daily30', e: '🗓️', n: 'Committed', d: 'Hit your daily goal 30 times', test: s => goalDays() >= 30 },
  { id: 'night', e: '🌙', n: 'Night Owl', d: 'Study after 11 pm', test: s => s.hist.some(h => new Date(h.t).getHours() >= 23) },
  { id: 'early', e: '🌅', n: 'Early Bird', d: 'Study before 7 am', test: s => s.hist.some(h => new Date(h.t).getHours() < 7) },
  { id: 'marathon', e: '🏃', n: 'Marathon', d: '100 questions in one day', test: s => Object.values(s.days).some(d => d.q >= 100) },
  { id: 'challenge10', e: '🎖️', n: 'Challenger', d: 'Complete 10 Daily Challenges', test: s => s.hist.filter(h => h.mode === 'Daily Challenge').length >= 10 }
];
function totalAnswered() { return Object.values(S.topics).reduce((a, t) => a + t.a, 0); }
function totalCorrect() { return Object.values(S.topics).reduce((a, t) => a + t.c, 0); }
function bestCombo() { return S.hist.reduce((m, h) => Math.max(m, h.combo || 0), 0); }
function goalDays() { return Object.values(S.days).filter(d => d.q >= (S.goal || 20)).length; }
function checkAch() {
  ACH.forEach(a => {
    if (!S.ach[a.id]) {
      let ok = false; try { ok = a.test(S); } catch (e) { }
      if (ok) { S.ach[a.id] = Date.now(); setTimeout(() => { toast(a.e + ' Badge unlocked: ' + a.n); confetti(); beep('level'); }, 600); }
    }
  });
}

/* ---------- weak-topic picker (adaptive) ---------- */
function weightedTopics(pool) {
  const out = [];
  pool.forEach(t => {
    const st = S.topics[t.id];
    let w = 6;                                /* never seen -> high priority */
    if (st && st.a) {
      const acc = st.c / st.a;
      w = acc < .5 ? 9 : acc < .7 ? 6 : acc < .85 ? 3 : 1;
      if (st.a < 6) w += 3;
    }
    for (let i = 0; i < w; i++) out.push(t.id);
  });
  return out;
}
function adaptivePool(levelIds) {
  const pool = TOPICS.filter(t => !levelIds || levelIds.includes(t.lvl));
  return weightedTopics(pool.length ? pool : TOPICS);
}
/* every level is always open - this suggests where to go next */
function recommendedLevel() {
  for (let i = 0; i < LEVELS.length; i++) {
    if (levelProgress(LEVELS[i].id) < 70) return LEVELS[i].id;
  }
  return 'C2';
}
function weakestTopics(n) {
  return TOPICS.filter(t => { const s = S.topics[t.id]; return s && s.a >= 4; })
    .sort((a, b) => mastery(a.id) - mastery(b.id)).slice(0, n || 5);
}

let AC = null;
function beep(kind) {
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime;
    const seq = kind === 'ok' ? [[660, 0], [880, .08]]
      : kind === 'bad' ? [[200, 0], [150, .09]]
      : kind === 'level' ? [[523, 0], [659, .09], [784, .18], [1046, .27]]
      : kind === 'tick' ? [[440, 0]] : [[520, 0]];
    seq.forEach(([f, d]) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = kind === 'bad' ? 'sawtooth' : 'triangle';
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + d);
      g.gain.exponentialRampToValueAtTime(.13, t + d + .012);
      g.gain.exponentialRampToValueAtTime(.0001, t + d + .22);
      o.connect(g); g.connect(AC.destination); o.start(t + d); o.stop(t + d + .25);
    });
  } catch (e) { }
}
function buzz(ms) { try { if (navigator.vibrate && S.sound) navigator.vibrate(ms || 18); } catch (e) { } }

let toastT = null;
function toast(msg) {
  const old = $('.toast'); if (old) old.remove();
  const d = document.createElement('div');
  d.className = 'toast'; d.innerHTML = msg;
  document.body.appendChild(d);
  clearTimeout(toastT);
  toastT = setTimeout(() => d.remove(), 2600);
}

const cvs = $('#cfx'), ctx = cvs.getContext('2d');
let parts = [], rafOn = false;
function sizeCanvas() { cvs.width = innerWidth; cvs.height = innerHeight; }
sizeCanvas(); addEventListener('resize', sizeCanvas);
function confetti(n) {
  const cols = ['#7c5cff', '#19e3ff', '#ff3dcb', '#2be08b', '#ffd470'];
  for (let i = 0; i < (n || 70); i++) {
    parts.push({
      x: innerWidth / 2 + (Math.random() - .5) * 180, y: innerHeight * .34,
      vx: (Math.random() - .5) * 11, vy: -Math.random() * 13 - 3,
      s: Math.random() * 7 + 3, c: pick(cols), r: Math.random() * 6, vr: (Math.random() - .5) * .35, life: 1
    });
  }
  if (!rafOn) { rafOn = true; requestAnimationFrame(tickFx); }
}
function tickFx() {
  ctx.clearRect(0, 0, cvs.width, cvs.height);
  parts = parts.filter(p => p.life > 0);
  parts.forEach(p => {
    p.vy += .36; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= .009;
    ctx.save(); ctx.globalAlpha = Math.max(0, p.life); ctx.translate(p.x, p.y); ctx.rotate(p.r);
    ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); ctx.restore();
  });
  if (parts.length) requestAnimationFrame(tickFx); else { rafOn = false; ctx.clearRect(0, 0, cvs.width, cvs.height); }
}

  const d = document.createElement('div');

function shiftMonth(n) { calMonth.setMonth(calMonth.getMonth() + n); drawCal(); }
function drawCal() {
  const grid = $('#calGrid'); if (!grid) return;
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  $('#calTitle').textContent = calMonth.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });

  }

    ? `<b style="color:var(--txt)">${md}</b> active days · <b style="color:var(--txt)">${mq}</b> questions · <b style="color:var(--txt)">${mq ? Math.round(mc / mq * 100) : 0}%</b> accuracy`

/* ==========================================================================
   8. QUIZ ENGINE
   ========================================================================== */

let Qz = null;
let qTimer = null;

function withSeed(seed, fn) {
  const orig = Math.random; let s = seed >>> 0 || 1;
  Math.random = function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  try { return fn(); } finally { Math.random = orig; }
}
function hashStr(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

function nextQuestion() {
  const c = Qz.cfg;
  let topicId;
  if (c.topicId) topicId = c.topicId;
  else if (c.ladder) {
    const lv = LEVELS[Qz.rung].id;
    topicId = pick(BY_LEVEL[lv]).id;
  } else if (c.ramp) {
    const maxIdx = Math.min(LEVELS.length - 1, Math.floor(Qz.score / 6));
    const lvls = LEVELS.slice(0, maxIdx + 1).map(l => l.id);
    topicId = pick(adaptivePool(lvls));
  } else topicId = pick(Qz.pool);
  return buildQ(topicId, c.format || 'auto');
}

function runQuiz(cfg) {
  cfg = Object.assign({ mode: 'Practice', count: 10, format: 'auto', double: false }, cfg);
  Qz = { cfg, i: 0, score: 0, wrong: 0, lives: cfg.lives || 0, rung: 0, answered: false, xp: 0, log: [], t0: Date.now() };
  Qz.pool = cfg.pool || adaptivePool(cfg.levels || null);

  if (cfg.fixed) { Qz.fixed = cfg.fixed; Qz.cfg.count = cfg.fixed.length; }

  startSession(cfg.mode, { level: cfg.levelId || '' });

  const w = document.createElement('div');
  w.id = 'quizwrap';
  w.innerHTML = '<div class="inner"><div id="qhead"></div><div id="qbody" class="grow"></div></div>';
  document.body.appendChild(w);
  document.body.style.overflow = 'hidden';

  if (cfg.seconds) {
    Qz.left = cfg.seconds;
    qTimer = setInterval(() => {
      Qz.left--;
      const el = $('#qtime');
      if (el) { el.textContent = fmtTime(Qz.left); el.classList.toggle('low', Qz.left <= 10); }
      if (Qz.left <= 0) { clearInterval(qTimer); finishQuiz(); }
    }, 1000);
  }
  showQuestion();
}

function fmtTime(s) { s = Math.max(0, s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

function quitQuiz() {
  if (Qz && Qz.i > 0 && !confirm('Leave this session? Your answers so far are already saved.')) return;
  clearInterval(qTimer);
  endSession();
  const w = $('#quizwrap'); if (w) w.remove();
  document.body.style.overflow = '';
  Qz = null;
  go(VIEW);
}

function showQuestion() {
  const c = Qz.cfg;
  if (!c.infinite && Qz.i >= c.count) return finishQuiz();
  Qz.answered = false;
  Qz.q = Qz.fixed ? Qz.fixed[Qz.i] : nextQuestion();
  const q = Qz.q;
  const pct = c.infinite ? Math.min(100, Qz.score * 4) : Math.round(Qz.i / c.count * 100);

  $('#qhead').innerHTML = `
    <div class="row" style="gap:10px">
      <button class="iconbtn" onclick="quitQuiz()">✕</button>
      <div class="qbar"><i style="width:${pct}%"></i></div>
      ${c.lives ? `<div class="hearts">${'❤️'.repeat(Qz.lives)}${'🖤'.repeat((c.lives) - Qz.lives)}</div>` : ''}
      ${c.seconds ? `<div class="timerbig" id="qtime">${fmtTime(Qz.left)}</div>` : ''}
    </div>
    <div class="row sb" style="margin-top:9px">
      <span class="cap">${esc(c.mode)}${c.infinite ? '' : ' · ' + (Qz.i + 1) + '/' + c.count}</span>
      <span class="tiny muted">${esc(q.lvl)} · ${esc(q.topicName)}</span>
    </div>
    ${c.infinite ? `<div class="row sb mt"><b style="font-size:26px">${Qz.score}</b><span class="tiny muted">${c.ladder ? LEVELS[Qz.rung].em + ' ' + LEVELS[Qz.rung].id + ' rung' : 'score'}</span></div>` : ''}`;

  const b = $('#qbody');
  if (q.type === 'mcq') {
    b.innerHTML = `<div class="cap mt">${q.prompt}</div>
      <div class="stem">${esc(q.stem).replace('___', '<u>&nbsp;&nbsp;?&nbsp;&nbsp;</u>')}</div>
      <div class="mt" id="opts">${q.options.map((o, i) =>
        `<button class="opt" data-o="${esc(o)}" onclick="answerMcq(this)"><span class="k">${'ABCD'[i]}</span>${esc(o)}</button>`).join('')}</div>
      <div id="fb"></div>`;
  } else if (q.type === 'type') {
    b.innerHTML = `<div class="cap mt">${q.prompt}</div>
      <div class="stem">${esc(q.stem).replace('___', '<u>&nbsp;&nbsp;?&nbsp;&nbsp;</u>')}</div>
      <input class="tin mt" id="tanswer" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" placeholder="your answer…">
      <button class="btn pri full mt" id="checkBtn" onclick="answerType()">Check</button>
      <div id="fb"></div>`;
    setTimeout(() => { const el = $('#tanswer'); if (el) { el.focus(); el.onkeydown = e => { if (e.key === 'Enter') answerType(); }; } }, 60);
  } else if (q.type === 'order') {
    b.innerHTML = `<div class="cap mt">${q.prompt}</div>
      <div class="slot mt" id="slot"></div>
      <div class="row wrap mt" id="bank">${q.words.map((w, i) =>
        `<button class="chip" data-i="${i}" onclick="pushWord(this)">${esc(w)}</button>`).join('')}</div>
      <div class="row mt" style="gap:9px">
        <button class="btn grow" onclick="clearSlot()">Clear</button>
        <button class="btn pri grow" onclick="answerOrder()">Check</button></div>
      <div id="fb"></div>`;
  } else if (q.type === 'error') {
    b.innerHTML = `<div class="cap mt">${q.prompt}</div>
      <div class="stem" id="errline">${q.words.map((w, i) =>
        `<span class="chip" style="display:inline-block;margin:3px 2px;font-size:16px" data-i="${i}" onclick="answerError(this)">${esc(w)}</span>`).join(' ')}</div>
      <div id="fb"></div>`;
  }
}

/* ---------- answer handlers ---------- */
function grade(ok, extra) {
  if (Qz.answered) return;
  Qz.answered = true;
  const q = Qz.q;
  const xp = recordAnswer(q, ok) * (Qz.cfg.double ? 2 : 1);
  if (Qz.cfg.double && ok) addXp(xp / 2);
  Qz.xp += xp;
  Qz.log.push({ t: q.topic, ok });
  if (ok) {
    Qz.score++;
    beep('ok'); buzz(14);
    const cb = sessionStats ? sessionStats.combo : 0;
    if (cb >= 3) comboPop('🔥 ' + cb + ' in a row!');
    if (Qz.cfg.ladder) { Qz.rungHits = (Qz.rungHits || 0) + 1; if (Qz.rungHits >= 5 && Qz.rung < LEVELS.length - 1) { Qz.rung++; Qz.rungHits = 0; Qz.rungMiss = 0; toast('⬆️ Promoted to ' + LEVELS[Qz.rung].id + '!'); } }
  } else {
    Qz.wrong++;
    beep('bad'); buzz([24, 40, 24]);
    if (Qz.cfg.lives) { Qz.lives--; }
    if (Qz.cfg.ladder) { Qz.rungMiss = (Qz.rungMiss || 0) + 1; Qz.rungHits = 0; if (Qz.rungMiss >= 2) { Qz.rungMiss = 0; if (Qz.rung > 0) { Qz.rung--; toast('⬇️ Back to ' + LEVELS[Qz.rung].id); } } }
  }
  showFeedback(ok, extra);
  paintTop();
  if (Qz.cfg.lives && Qz.lives <= 0) setTimeout(() => finishQuiz(), 1500);
}

function showFeedback(ok, extra) {
  const q = Qz.q;
  const fast = Qz.cfg.fast;
  const fb = $('#fb');
  const right = q.type === 'order' ? q.answer + (q.end || '')
    : q.type === 'error' ? q.answer
    : q.answer;
  fb.innerHTML = `<div class="fb ${ok ? 'ok' : 'no'}">
      <b>${ok ? pick(['✅ Correct!', '✅ Nice!', '✅ Exactly!', '✅ Well done!']) : '❌ Not quite'}</b>
      ${ok ? '' : `<p style="margin-bottom:6px">Correct answer: <b style="color:var(--ok)">${esc(right)}</b></p>`}
      <p>${q.explain || ''}</p>
      ${extra ? `<p class="tiny muted" style="margin-top:6px">${extra}</p>` : ''}
    </div>
    <button class="btn ${ok ? 'cy' : 'pri'} full mt" id="nextBtn" onclick="nextStep()">${Qz.cfg.lives && Qz.lives <= 0 ? 'See results' : 'Continue →'}</button>`;
  if (q.type === 'mcq') {
    $$('#opts .opt').forEach(b => {
      const v = b.dataset.o;
      if (v === q.answer) b.classList.add('ok');
      else if (b.classList.contains('picked')) b.classList.add('no');
      b.onclick = null;
    });
  }
  const nb = $('#nextBtn');
  if (fast) setTimeout(() => { if (Qz && Qz.answered) nextStep(); }, ok ? 700 : 2000);
  else if (nb) nb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function nextStep() {
  if (!Qz) return;
  Qz.i++;
  if (Qz.cfg.lives && Qz.lives <= 0) return finishQuiz();
  if (Qz.cfg.seconds && Qz.left <= 0) return finishQuiz();
  showQuestion();
}

function answerMcq(btn) {
  if (Qz.answered) return;
  btn.classList.add('picked');
  grade(btn.dataset.o === Qz.q.answer);
}
function answerType() {
  if (Qz.answered) return;
  const el = $('#tanswer'); if (!el) return;
  const val = el.value;
  if (!val.trim()) { el.focus(); return; }
  const ok = Qz.q.accept.some(a => normalise(a) === normalise(val));
  el.blur();
  grade(ok, ok ? '' : 'You wrote: "' + esc(val) + '"');
}
function pushWord(btn) {
  if (Qz.answered) return;
  btn.classList.add('used');
  const s = $('#slot');
  const c = document.createElement('button');
  c.className = 'chip'; c.textContent = btn.textContent;
  c.onclick = () => { if (Qz.answered) return; c.remove(); btn.classList.remove('used'); };
  s.appendChild(c);
}
function clearSlot() { if (Qz.answered) return; $('#slot').innerHTML = ''; $$('#bank .chip').forEach(b => b.classList.remove('used')); }
function answerOrder() {
  if (Qz.answered) return;
  const built = $$('#slot .chip').map(c => c.textContent).join(' ');
  if (!built) return;
  grade(normalise(built) === normalise(Qz.q.answer), 'You built: "' + esc(built) + '"');
}
function answerError(span) {
  if (Qz.answered) return;
  const ok = +span.dataset.i === Qz.q.badIndex;
  span.style.background = ok ? 'rgba(43,224,139,.3)' : 'rgba(255,84,112,.3)';
  $$('#errline .chip').forEach(s => { if (+s.dataset.i === Qz.q.badIndex) s.style.boxShadow = '0 0 0 2px var(--ok)'; });
  grade(ok, 'The sentence should read: “' + esc(Qz.q.answer) + '”');
}

/* ---------- results ---------- */
function finishQuiz() {
  clearInterval(qTimer);
  if (!Qz) return;
  const c = Qz.cfg, res = endSession() || { q: Qz.i, c: Qz.score, xp: Qz.xp, maxCombo: 0, mins: 0 };
  const total = Math.max(1, Qz.log.length);
  const pct = Math.round(Qz.score / total * 100);

  /* records */
  if (c.mode === 'Speed Round') S.records.speed = Math.max(S.records.speed || 0, Qz.score);
  if (c.mode === 'Survival') S.records.survival = Math.max(S.records.survival || 0, Qz.score);
  if (c.mode === 'Ladder') S.records.ladder = Math.max(S.records.ladder || 0, Qz.rung);
  if (c.mode === 'Test' && c.levelId) S.records.tests[c.levelId] = Math.max(S.records.tests[c.levelId] || 0, pct);
  if (c.mode === 'Daily Challenge') LS.set('gq_dc_' + CURID, todayKey());
  checkAch(); save();

  const byTopic = {};
  Qz.log.forEach(l => { byTopic[l.t] = byTopic[l.t] || { a: 0, c: 0 }; byTopic[l.t].a++; if (l.ok) byTopic[l.t].c++; });
  const weak = Object.keys(byTopic).filter(k => byTopic[k].c < byTopic[k].a).sort((a, b) => (byTopic[a].c / byTopic[a].a) - (byTopic[b].c / byTopic[b].a));

  const band = pct >= 90 ? ['🏆', 'Outstanding'] : pct >= 75 ? ['🌟', 'Strong'] : pct >= 60 ? ['👍', 'Solid'] : pct >= 40 ? ['📈', 'Getting there'] : ['💪', 'Keep going'];
  if (pct >= 80) setTimeout(confetti, 220);

  $('#qhead').innerHTML = '';
  $('#qbody').innerHTML = `
    <div class="tc" style="padding-top:18px">
      <div style="font-size:58px">${band[0]}</div>
      <h2 style="margin:4px 0 2px;font-size:27px">${band[1]}!</h2>
      <div class="muted sm">${esc(c.mode)}${c.levelId ? ' · ' + c.levelId : ''}</div>
    </div>
    <div class="ring mt" style="margin:18px auto 0">${ringSvg(pct)}
      <div class="mid"><b>${pct}%</b><span class="tiny muted">${Qz.score}/${total}</span></div></div>
    <div class="row mt2" style="gap:9px">
      <div class="stat"><b class="mono">+${Qz.xp}</b><span>XP earned</span></div>
      <div class="stat"><b class="mono">${res.maxCombo || 0}</b><span>Best combo</span></div>
      <div class="stat"><b class="mono">${res.mins || 0}</b><span>Minutes</span></div>
    </div>
    ${c.infinite ? `<div class="card mt tc"><div class="cap">Final score</div><b style="font-size:32px">${Qz.score}</b>
      ${c.ladder ? `<div class="tiny muted">Highest rung: ${LEVELS[Qz.rung].em} ${LEVELS[Qz.rung].id}</div>` : ''}</div>` : ''}
    ${c.levelId === 'MIX' ? cefrCard(pct) : ''}
    ${weak.length ? `<div class="cap mt2 mb">Review these</div>${weak.slice(0, 4).map(id => `
      <button class="topic" onclick="closeQuizThen('openTopic','${id}')">
        <div class="n">${TMAP[id].em}</div>
        <div class="t"><b>${esc(TMAP[id].name)}</b><div class="tiny muted">${byTopic[id].c}/${byTopic[id].a} correct here · tap to read the rule</div></div>
        <div style="font-size:18px;opacity:.4">›</div></button>`).join('')}`
      : '<div class="card mt tc sm" style="color:var(--ok)">Perfect run — nothing to review! 🎉</div>'}
    <div class="row mt2" style="gap:9px">
      <button class="btn grow" onclick="quitQuiz()">Done</button>
      <button class="btn pri grow" onclick="repeatQuiz()">Again →</button>
    </div>
    <div style="height:20px"></div>`;
  Qz.done = true;
  paintTop();
}
function cefrCard(pct) {
  const band = pct >= 92 ? 'C2' : pct >= 82 ? 'C1' : pct >= 70 ? 'B2' : pct >= 55 ? 'B1' : pct >= 38 ? 'A2' : 'A1';
  const l = LEVELS.find(x => x.id === band);
  return `<div class="card mt tc" style="border-color:${l.color}66">
    <div class="cap">Estimated level</div>
    <div style="font-size:40px">${l.em}</div>
    <b style="font-size:22px;color:${l.color}">${l.id} — ${l.name}</b>
    <p class="tiny muted" style="margin:7px 0 0">A rough guide based on this test only. Keep practising and take it again in a week.</p></div>`;
}
function repeatQuiz() {
  const c = Qz.cfg;
  clearInterval(qTimer);
  const w = $('#quizwrap'); if (w) w.remove();
  document.body.style.overflow = '';
  const again = Object.assign({}, c);
  delete again.fixed;
  Qz = null;
  runQuiz(again);
}
function closeQuizThen(fn, arg) {
  clearInterval(qTimer);
  const w = $('#quizwrap'); if (w) w.remove();
  document.body.style.overflow = '';
  Qz = null; go(VIEW);
  window[fn](arg);
}

/* ==========================================================================
   9. MODE LAUNCHERS
   ========================================================================== */

function quickPractice(n) { runQuiz({ mode: 'Practice', count: n || 10 }); }
function practiceLevel(lv) { runQuiz({ mode: 'Practice · ' + lv, count: 15, levels: [lv], levelId: lv }); }
function practiceTopic(id, n) { runQuiz({ mode: TMAP[id].name, count: n || 12, topicId: id }); }
const FORMAT_IDS = {};
function formatPool(f) {
  if (f !== 'order' && f !== 'error') return null;
  if (!FORMAT_IDS[f]) {
    const test = f === 'order' ? canOrder : orderable;
    FORMAT_IDS[f] = TOPICS.filter(t => {
      for (let i = 0; i < 10; i++) { try { if (test(t.gen())) return true; } catch (e) { return false; } }
      return false;
    }).map(t => t.id);
  }
  const ids = FORMAT_IDS[f];
  return ids.length ? weightedTopics(ids.map(id => TMAP[id])) : null;
}
function practiceFormat(f) {
  const names = { mcq: 'Multiple choice', type: 'Type the answer', order: 'Word order', error: 'Find the error' };
  runQuiz({ mode: names[f], count: 12, format: f, pool: formatPool(f) });
}
function startTest(lv) {
  if (lv === 'MIX') {
    const pool = [];
    LEVELS.forEach(l => BY_LEVEL[l.id].forEach(t => pool.push(t.id)));
    return runQuiz({ mode: 'Test', levelId: 'MIX', count: 30, seconds: 15 * 60, pool });
  }
  runQuiz({ mode: 'Test', levelId: lv, count: 15, seconds: 8 * 60, levels: [lv] });
}
function startDaily() {
  const seed = hashStr(todayKey() + '|gq');
  const fixed = withSeed(seed, () => {
    const all = [];
    LEVELS.forEach(l => BY_LEVEL[l.id].forEach(t => all.push(t.id)));
    const chosen = shuffle(all).slice(0, 10);
    return chosen.map(id => buildQ(id, pick(['mcq', 'mcq', 'type', 'order', 'error'])));
  });
  runQuiz({ mode: 'Daily Challenge', fixed, double: true });
}
function gameSpeed() { runQuiz({ mode: 'Speed Round', infinite: true, seconds: 60, fast: true, format: 'mcq' }); }
function gameSurvival() { runQuiz({ mode: 'Survival', infinite: true, lives: 3, ramp: true }); }
function gameBuilder() { runQuiz({ mode: 'Word Builder', count: 12, format: 'order', pool: formatPool('order') }); }
function gameHunt() { runQuiz({ mode: 'Error Hunt', count: 12, format: 'error', pool: formatPool('error') }); }
function gameLadder() { runQuiz({ mode: 'Ladder', infinite: true, lives: 3, ladder: true }); }

function switchProfile(id) {
  CURID = id; LS.set('gq_cur', id);
  S = LS.get('gq_d_' + id, null) || blankState();
  const b = blankState(); for (const k in b) if (S[k] === undefined) S[k] = b[k];
  closeSheets(); go('home'); toast('Switched to ' + esc(S.name));
}
function newProfile() {
  const name = prompt('Name for the new profile:', '');
  if (!name) return;
  const id = 'p' + Date.now();
  const av = pick(AVATARS);
  PROFILES.push({ id, name: name.slice(0, 20), avatar: av });
  LS.set('gq_profiles', PROFILES);
  LS.set('gq_d_' + id, blankState(name.slice(0, 20), av));
  switchProfile(id);
}
function deleteProfile(id) {
  if (!confirm('Delete this profile and all of its progress? This cannot be undone.')) return;
  PROFILES = PROFILES.filter(p => p.id !== id);
  LS.set('gq_profiles', PROFILES); LS.del('gq_d_' + id);
  if (CURID === id) switchProfile(PROFILES[0].id); else { closeSheets(); openProfiles(); }
}

function syncProfile() {
  const p = PROFILES.find(x => x.id === CURID);
  if (p) { p.name = S.name; p.avatar = S.avatar; LS.set('gq_profiles', PROFILES); }
  save();
}
function exportData() {
  const blob = new Blob([JSON.stringify({ app: 'GrammarQuest', v: 1, profile: PROFILES.find(p => p.id === CURID), data: S }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'grammarquest-' + S.name.replace(/\W+/g, '') + '-' + todayKey() + '.json';
  a.click();
  toast('Backup downloaded');
}
function importData(input) {
  const f = input.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result);
      if (!j.data) throw 0;
      S = j.data;
      const b = blankState(); for (const k in b) if (S[k] === undefined) S[k] = b[k];
      syncProfile(); save(); closeSheets(); go('home'); toast('Progress restored ✅');
    } catch (e) { toast('That file could not be read.'); }
  };
  r.readAsText(f);
}
function resetAll() {
  if (!confirm('Erase all progress for ' + S.name + '? This cannot be undone.')) return;
  S = blankState(S.name, S.avatar); save(); closeSheets(); go('home'); toast('Progress reset');
}

const DICT = {};
const DICT_KEYS = [];

function dictAdd(line) {
  const f = line.split('|');
  const w = (f[0] || '').trim();
  if (!w) return;
  const k = w.toLowerCase();
  const ent = {
    w: w,
    p: (f[1] || '').trim(),
    d: (f[2] || '').trim(),
    e: (f[3] || '').split(' ~ ').map(x => x.trim()).filter(Boolean),
    fm: (f[4] || '').trim(),
    s: (f[5] || '').split(',').map(x => x.trim()).filter(Boolean),
    n: (f[6] || '').trim(),
    t: (f[7] || '').split(',').map(x => x.trim()).filter(Boolean)
  };
  const old = DICT[k];
  if (old) {
    /* merge: keep the richer field, union lists */
    old.p = old.p || ent.p;
    old.d = old.d.length >= ent.d.length ? old.d : ent.d;
    old.e = uniq(old.e.concat(ent.e)).slice(0, 4);
    old.fm = old.fm || ent.fm;
    old.s = uniq(old.s.concat(ent.s));
    old.n = old.n.length >= ent.n.length ? old.n : ent.n;
    old.t = uniq(old.t.concat(ent.t));
  } else {
    DICT[k] = ent;
    DICT_KEYS.push(k);
  }
}

/* ---------- index of inflected forms, so "went" finds "go" ---------- */
const FORMS = {};
const FORM_STOP = ['uncountable', 'plural', 'plural only', 'singular', ''];
function addForm(f, base) {
  f = String(f).toLowerCase().trim();
  if (!f || FORM_STOP.indexOf(f) >= 0 || DICT[f] || FORMS[f]) return;
  if (!/^[a-z' -]+$/.test(f) || f.split(' ').length > 2) return;
  FORMS[f] = base;
}
DICT_KEYS.forEach(k => {
  const fm = DICT[k].fm || '';
  if (!fm || /^\//.test(fm)) return;
  fm.replace(/^(plural|singular):\s*/i, '').split(/[·,]/).forEach(part => {
    part.split('/').forEach(w => addForm(w.replace(/\(.*?\)/g, ''), k));
  });
});
V.forEach(v => [v.s, v.p, v.pp, v.g].forEach(f => addForm(f, v.b.toLowerCase())));
ADJ.forEach(a => [a.c, a.s].forEach(f => addForm(f, a.b.toLowerCase())));

function catWords(id) { return DICT_KEYS.filter(k => DICT[k].t.indexOf(id) >= 0); }

/* ---------- search ---------- */
function dictSearch(q, limit) {
  q = normalise(q);
  if (!q) return [];
  const starts = [], contains = [], fuzzy = [];
  for (let i = 0; i < DICT_KEYS.length; i++) {
    const k = DICT_KEYS[i];
    if (k === q) starts.unshift(k);
    else if (k.indexOf(q) === 0) starts.push(k);
    else if (k.indexOf(q) > 0) contains.push(k);
    else if (q.length >= 4 && editClose(k, q)) fuzzy.push(k);
  }
  if (q.length >= 3) {
    const dre = new RegExp('\\b' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    for (let i = 0; i < DICT_KEYS.length && contains.length < 40; i++) {
      const e = DICT[DICT_KEYS[i]];
      if (starts.indexOf(DICT_KEYS[i]) < 0 && contains.indexOf(DICT_KEYS[i]) < 0 &&
          (dre.test(e.d.toLowerCase()) || e.s.some(s => s.toLowerCase().indexOf(q) === 0))) {
        contains.push(DICT_KEYS[i]);
      }
    }
  }
  let out = starts.concat(contains, fuzzy);
  /* an inflected form - "went", "children", "bigger" - points at its base word */
  const base = FORMS[q];
  if (base && out.indexOf(base) < 0) out.unshift(base);
  return out.slice(0, limit || 50);
}
/* cheap check for a single typo: one wrong, missing, extra or swapped letter */
function editClose(a, b) {
  if (Math.abs(a.length - b.length) > 1) return false;
  let i = 0, j = 0, diff = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { i++; j++; continue; }
    if (++diff > 1) return false;
    if (a.length > b.length) i++;
    else if (a.length < b.length) j++;
    else {
      if (a[i + 1] === b[j] && a[i] === b[j + 1]) { i += 2; j += 2; }  /* swapped pair */
      else { i++; j++; }
    }
  }
  return true;
}

/* ---------- pronunciation (offline, uses the phone's own voice) ---------- */
let VOICE = null;
function pickVoice() {
  try {
    const vs = speechSynthesis.getVoices();
    VOICE = vs.find(v => /en[-_]GB/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
  } catch (e) { }
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speakWord(w) {
  if (!('speechSynthesis' in window)) { toast('Your browser cannot speak words'); return; }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(w);
    u.lang = 'en-GB'; u.rate = .85;
    if (VOICE) u.voice = VOICE;
    speechSynthesis.speak(u);
  } catch (e) { toast('Pronunciation is not available here'); }
}

/* ---------- online lookup with permanent local cache ---------- */
const WCACHE_KEY = 'gq_wcache';
let WCACHE = LS.get(WCACHE_KEY, {});
function cacheWord(k, ent) {
  WCACHE[k] = ent;
  const keys = Object.keys(WCACHE);
  if (keys.length > 1500) delete WCACHE[keys[0]];
  LS.set(WCACHE_KEY, WCACHE);
}
function lookupLocal(word) {
  const k = normalise(word);
  return DICT[k] || WCACHE[k] || null;
}
function onlineLookup(word) {
  const k = normalise(word);
  return fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(k))
    .then(r => { if (!r.ok) throw new Error('not found'); return r.json(); })
    .then(j => {
      const first = j[0];
      const defs = [], ex = [], syn = [];
      let pos = '';
      (first.meanings || []).forEach(m => {
        if (!pos) pos = m.partOfSpeech || '';
        (m.definitions || []).slice(0, 2).forEach(d => {
          if (d.definition) defs.push((m.partOfSpeech ? '(' + m.partOfSpeech + ') ' : '') + d.definition);
          if (d.example) ex.push(d.example);
        });
        (m.synonyms || []).slice(0, 5).forEach(s => syn.push(s));
      });
      const phon = first.phonetic || ((first.phonetics || []).find(p => p.text) || {}).text || '';
      const ent = {
        w: first.word || word, p: pos, d: defs[0] || '', more: defs.slice(1, 5),
        e: ex.slice(0, 3), fm: phon, s: uniq(syn).slice(0, 6), n: '', t: ['online'], online: true
      };
      cacheWord(k, ent);
      return ent;
    });
}
